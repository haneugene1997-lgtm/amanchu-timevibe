<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A만추 — Time-Vibe Simulator</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/3.19.0/webfont/tabler-icons.min.css">
  <style>
    :root {
      --color-background-primary: #ffffff;
      --color-background-secondary: #f5f4f0;
      --color-background-tertiary: #eeece8;
      --color-text-primary: #1a1a18;
      --color-text-secondary: #73726c;
      --color-text-tertiary: #9c9a92;
      --color-border-tertiary: rgba(0,0,0,0.11);
      --color-border-secondary: rgba(0,0,0,0.20);
      --border-radius-md: 8px;
      --border-radius-lg: 12px;
      --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif;
      --font-serif: Georgia, 'Times New Roman', serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --color-background-primary: #1c1c1a;
        --color-background-secondary: #252523;
        --color-background-tertiary: #2e2e2b;
        --color-text-primary: #e8e6de;
        --color-text-secondary: #9c9a92;
        --color-text-tertiary: #6e6d67;
        --color-border-tertiary: rgba(255,255,255,0.10);
        --color-border-secondary: rgba(255,255,255,0.18);
      }
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-sans);
      background: var(--color-background-tertiary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    #card {
      background: var(--color-background-secondary);
      border: 0.5px solid var(--color-border-tertiary);
      border-radius: 16px;
      max-width: 680px;
      width: 100%;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }
    #header {
      padding: 18px 24px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    #logo { font-size: 15px; font-weight: 500; color: var(--color-text-primary); }
    #logo span { color: var(--color-text-tertiary); font-weight: 400; font-size: 12px; margin-left: 8px; }
    #wrap { padding: 16px; position: relative; }
    #atmo {
      position: absolute; inset: 0;
      border-radius: var(--border-radius-lg);
      pointer-events: none;
      transition: background 0.7s;
      z-index: 0;
    }
    #content { position: relative; z-index: 1; }
    #era-banner {
      display: flex; align-items: flex-start; justify-content: space-between;
      background: var(--color-background-primary);
      border: 0.5px solid var(--color-border-tertiary);
      border-radius: var(--border-radius-md);
      padding: 10px 14px; margin-bottom: 12px; gap: 12px;
    }
    #era-mode { font-size: 11px; font-weight: 500; margin-bottom: 3px; transition: color 0.5s; }
    #era-main { font-size: 15px; font-weight: 500; color: var(--color-text-primary); }
    #era-sub { font-size: 12px; color: var(--color-text-secondary); text-align: right; max-width: 240px; line-height: 1.5; }
    #main-grid { display: grid; grid-template-columns: 182px 1fr; gap: 12px; margin-bottom: 12px; }
    #avatar-card {
      background: var(--color-background-primary);
      border: 0.5px solid var(--color-border-tertiary);
      border-radius: var(--border-radius-lg);
      padding: 16px; display: flex; flex-direction: column; align-items: center; gap: 10px;
    }
    #avatar-frame {
      width: 84px; height: 84px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      border: 2px solid;
      transition: background 0.5s, border-color 0.5s, transform 0.2s;
    }
    #avatar-icon { font-size: 34px; transition: color 0.5s; }
    #user-name { font-size: 14px; font-weight: 500; color: var(--color-text-primary); }
    #user-desc { font-size: 11px; color: var(--color-text-tertiary); }
    #soul-box {
      width: 100%; padding: 8px 10px;
      border-radius: var(--border-radius-md);
      text-align: center; transition: background 0.5s;
    }
    #soul-era { font-size: 13px; font-weight: 500; transition: color 0.5s; }
    #soul-label { font-size: 11px; color: var(--color-text-tertiary); margin-top: 2px; letter-spacing: 0.05em; text-transform: uppercase; }
    #amo-card {
      background: var(--color-background-primary);
      border: 0.5px solid var(--color-border-tertiary);
      border-radius: var(--border-radius-lg);
      padding: 14px; display: flex; flex-direction: column;
    }
    #board-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    #board-title { font-size: 13px; font-weight: 500; color: var(--color-text-secondary); }
    #board-badge { font-size: 11px; padding: 3px 10px; border-radius: 99px; transition: background 0.4s, color 0.4s; }
    #items-grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px;
      transition: opacity 0.22s;
    }
    .item-slot {
      background: var(--color-background-secondary);
      border-radius: var(--border-radius-md);
      padding: 10px 6px; display: flex; flex-direction: column;
      align-items: center; gap: 5px; min-height: 68px; justify-content: center;
    }
    .item-slot i { font-size: 20px; }
    .item-slot-label { font-size: 11px; color: var(--color-text-secondary); text-align: center; line-height: 1.3; }
    #match-hint {
      margin-top: 10px; padding: 8px 10px;
      background: var(--color-background-secondary);
      border-radius: var(--border-radius-md);
      font-size: 11px; color: var(--color-text-secondary); line-height: 1.5;
      border-left: 2px solid; transition: border-color 0.5s;
    }
    #slider-row {
      display: flex; align-items: center; gap: 10px;
      background: var(--color-background-primary);
      border: 0.5px solid var(--color-border-tertiary);
      border-radius: var(--border-radius-md);
      padding: 10px 14px;
    }
    .era-tag { font-size: 11px; color: var(--color-text-tertiary); white-space: nowrap; }
    #time-slider { flex: 1; cursor: pointer; }
    #era-quote {
      text-align: center; font-size: 13px; color: var(--color-text-tertiary);
      font-family: var(--font-serif);
      margin-top: 12px; margin-bottom: 4px;
      min-height: 20px; transition: all 0.5s;
      font-style: italic; letter-spacing: 0.01em;
    }
    input[type="range"] {
      -webkit-appearance: none; appearance: none;
      height: 4px; border-radius: 2px;
      background: var(--color-border-secondary);
      outline: none; border: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px; height: 18px; border-radius: 50%;
      background: var(--color-text-primary);
      cursor: pointer;
      border: 3px solid var(--color-background-primary);
      box-shadow: 0 0 0 1px var(--color-border-secondary);
      transition: transform 0.15s;
    }
    input[type="range"]::-webkit-slider-thumb:active { transform: scale(1.2); }
    input[type="range"]::-moz-range-thumb {
      width: 18px; height: 18px; border-radius: 50%;
      background: var(--color-text-primary);
      cursor: pointer; border: 3px solid var(--color-background-primary);
      box-shadow: 0 0 0 1px var(--color-border-secondary);
    }

    @media (max-width: 500px) {
      #main-grid { grid-template-columns: 1fr; }
      #era-banner { flex-direction: column; }
      #era-sub { text-align: left; max-width: 100%; }
    }
  </style>
</head>
<body>
<div id="card">
  <div id="header">
    <div id="logo">A만추 <span>Time-Vibe Simulator</span></div>
  </div>
  <div id="wrap">
    <div id="atmo"></div>
    <div id="content">
      <div id="era-banner">
        <div>
          <div id="era-mode"></div>
          <div id="era-main"></div>
        </div>
        <div id="era-sub"></div>
      </div>
      <div id="main-grid">
        <div id="avatar-card">
          <div id="avatar-frame">
            <i id="avatar-icon" class="ti ti-user" aria-hidden="true"></i>
          </div>
          <div id="user-name">유진</div>
          <div id="user-desc">SKT · 서울</div>
          <div id="soul-box">
            <div id="soul-era"></div>
            <div id="soul-label">Soul-Age</div>
          </div>
        </div>
        <div id="amo-card">
          <div id="board-header">
            <div id="board-title">Amo Board</div>
            <div id="board-badge"></div>
          </div>
          <div id="items-grid"></div>
          <div id="match-hint"></div>
        </div>
      </div>
      <div id="slider-row">
        <span class="era-tag">Past</span>
        <input type="range" id="time-slider" min="0" max="100" value="50" step="1">
        <span class="era-tag">Future</span>
      </div>
      <div id="era-quote"></div>
    </div>
  </div>
</div>

<script>
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
const p = (l, d) => dark ? d : l;

const states = {
  past: {
    atmo: p('rgba(250,198,117,0.15)','rgba(250,198,117,0.06)'),
    eraMode: '과거 — Nostalgia Mode',
    eModeColor: p('#BA7517','#FAC775'),
    eraMain: '2000년대의 나',
    eraSub: '가장 뜨거웠던 시절의 감성으로 필터링됩니다',
    soulEra: '2004년 가을',
    soulEraColor: p('#BA7517','#FAC775'),
    soulBoxBg: p('#FAEEDA','#633806'),
    avatarIcon: 'ti-flame',
    avatarBg: p('#FAEEDA','#633806'),
    avatarBorder: p('#EF9F27','#854F0B'),
    avatarColor: p('#BA7517','#FAC775'),
    badgeBg: p('#FAEEDA','#633806'),
    badgeColor: p('#BA7517','#FAC775'),
    badgeText: '레트로 감성',
    matchHintColor: p('#EF9F27','#854F0B'),
    matchHint: '음악 취향의 73%가 2000년대 발라드. 당신의 영혼은 2004년 가을에 머물고 있어요.',
    quote: '"나는 지금 여기 있지만, 결은 그 시절에 머물러 있어."',
    items: [
      { icon: 'ti-music',  label: '90년대 발라드', color: p('#BA7517','#FAC775') },
      { icon: 'ti-camera', label: '필름 카메라',   color: p('#993C1D','#F0997B') },
      { icon: 'ti-sun',    label: '따뜻한 기억',   color: p('#BA7517','#FAC775') },
      { icon: 'ti-heart',  label: '첫사랑의 결',   color: p('#993556','#ED93B1') },
      { icon: 'ti-photo',  label: '폴라로이드',    color: p('#993C1D','#F0997B') },
      { icon: 'ti-star',   label: '빛나던 순간',   color: p('#BA7517','#FAC775') },
    ]
  },
  present: {
    atmo: 'transparent',
    eraMode: '현재 — Present',
    eModeColor: 'var(--color-text-secondary)',
    eraMain: '2026년 오늘의 나',
    eraSub: '지금 이 순간, 내가 살고 있는 시간',
    soulEra: '2026년 봄',
    soulEraColor: 'var(--color-text-primary)',
    soulBoxBg: 'var(--color-background-secondary)',
    avatarIcon: 'ti-user',
    avatarBg: 'var(--color-background-secondary)',
    avatarBorder: 'var(--color-border-secondary)',
    avatarColor: 'var(--color-text-primary)',
    badgeBg: 'var(--color-background-secondary)',
    badgeColor: 'var(--color-text-secondary)',
    badgeText: '현재 진행형',
    matchHintColor: 'var(--color-border-secondary)',
    matchHint: '지금 이 순간의 결이 맞는 만추를 찾고 있어요.',
    quote: '"현재는 내가 가장 잘 아는 시간."',
    items: [
      { icon: 'ti-coffee',    label: '오늘의 커피', color: 'var(--color-text-secondary)' },
      { icon: 'ti-book',      label: '읽는 중인 책', color: 'var(--color-text-secondary)' },
      { icon: 'ti-headphones',label: '오늘의 음악', color: 'var(--color-text-secondary)' },
      { icon: 'ti-leaf',      label: '작은 성장들', color: p('#3B6D11','#C0DD97') },
      { icon: 'ti-pencil',    label: '일상의 기록', color: 'var(--color-text-secondary)' },
      { icon: 'ti-map-pin',   label: '자주 가는 곳', color: 'var(--color-text-secondary)' },
    ]
  },
  future: {
    atmo: p('rgba(55,138,221,0.09)','rgba(55,138,221,0.05)'),
    eraMode: '미래 — Visionary Mode',
    eModeColor: p('#185FA5','#85B7EB'),
    eraMain: '2036년의 나',
    eraSub: 'AI가 취향 데이터로 예측한 10년 뒤의 모습',
    soulEra: '2036년 봄',
    soulEraColor: p('#185FA5','#85B7EB'),
    soulBoxBg: p('#E6F1FB','#0C447C'),
    avatarIcon: 'ti-diamond',
    avatarBg: p('#E6F1FB','#0C447C'),
    avatarBorder: p('#378ADD','#185FA5'),
    avatarColor: p('#185FA5','#85B7EB'),
    badgeBg: p('#E6F1FB','#0C447C'),
    badgeColor: p('#185FA5','#85B7EB'),
    badgeText: '비전 모드',
    matchHintColor: p('#378ADD','#185FA5'),
    matchHint: '같은 미래를 꿈꾸는 만추와 연결해드려요. 세대가 달라도 괜찮아요.',
    quote: '"지금의 고단함은 미래의 우아함이 될 거야."',
    items: [
      { icon: 'ti-diamond',   label: '단단해진 취향', color: p('#185FA5','#85B7EB') },
      { icon: 'ti-briefcase', label: '커리어의 완성', color: p('#185FA5','#85B7EB') },
      { icon: 'ti-chart-line',label: '성장의 궤적',   color: p('#0F6E56','#5DCAA5') },
      { icon: 'ti-award',     label: '이뤄낼 것들',   color: p('#0F6E56','#5DCAA5') },
      { icon: 'ti-globe',     label: '넓어진 세계',   color: p('#185FA5','#85B7EB') },
      { icon: 'ti-rocket',    label: '다음 챕터',     color: p('#534AB7','#AFA9EC') },
    ]
  }
};

function getKey(v) {
  if (v < 35) return 'past';
  if (v > 65) return 'future';
  return 'present';
}

function renderItems(items) {
  const grid = document.getElementById('items-grid');
  grid.style.opacity = '0';
  setTimeout(() => {
    grid.innerHTML = '';
    items.forEach(item => {
      const el = document.createElement('div');
      el.className = 'item-slot';
      el.innerHTML = `<i class="ti ${item.icon}" style="color:${item.color}" aria-hidden="true"></i><div class="item-slot-label">${item.label}</div>`;
      grid.appendChild(el);
    });
    grid.style.opacity = '1';
  }, 180);
}

let cur = null;
function update(val) {
  const key = getKey(val);
  if (key === cur) return;
  cur = key;
  const s = states[key];

  document.getElementById('atmo').style.background = s.atmo;
  const em = document.getElementById('era-mode');
  em.textContent = s.eraMode; em.style.color = s.eModeColor;
  document.getElementById('era-main').textContent = s.eraMain;
  document.getElementById('era-sub').textContent = s.eraSub;
  document.getElementById('soul-era').textContent = s.soulEra;
  document.getElementById('soul-era').style.color = s.soulEraColor;
  document.getElementById('soul-box').style.background = s.soulBoxBg;

  const ai = document.getElementById('avatar-icon');
  ai.className = `ti ${s.avatarIcon}`; ai.style.color = s.avatarColor;
  const af = document.getElementById('avatar-frame');
  af.style.background = s.avatarBg; af.style.borderColor = s.avatarBorder;
  af.style.transform = 'scale(0.88)';
  setTimeout(() => { af.style.transform = 'scale(1)'; }, 150);

  const bb = document.getElementById('board-badge');
  bb.style.background = s.badgeBg; bb.style.color = s.badgeColor; bb.textContent = s.badgeText;
  document.getElementById('match-hint').textContent = s.matchHint;
  document.getElementById('match-hint').style.borderLeftColor = s.matchHintColor;
  document.getElementById('era-quote').textContent = s.quote;
  renderItems(s.items);
}

document.getElementById('time-slider').addEventListener('input', e => update(+e.target.value));
update(50);
</script>
</body>
</html>
